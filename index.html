<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>METAWINNERS: TRIGGER PHRASE</title>
  <link rel="icon" href="assets/ui/favicon.png" />
  <link rel="apple-touch-icon" href="assets/ui/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1920" height="1080"></canvas>
    <div id="ui">
      <button type="button" id="btnCover" aria-label="Hold to take cover and reload">HOLD COVER</button>
      <div id="rightBtns">
        <button type="button" id="btnFs" aria-label="Full screen" aria-pressed="false">FULL</button>
        <button type="button" id="btnMute" aria-label="Mute">BGM</button>
        <button type="button" id="btnPause" aria-label="Pause">II</button>
      </div>
    </div>
    <div id="tiltHint">ROTATE FOR THE FULL STAGE</div>
    <div id="iosHint" hidden>
      <p>For a full-screen game, tap Share, then Add to Home Screen.</p>
      <button type="button" id="iosHintDismiss">OK</button>
    </div>
    <div id="boot">
      <div class="boot-card">
        <div class="boot-kicker">METAWINNERS</div>
        <div class="boot-title">TRIGGER PHRASE</div>
        <div class="boot-bar"><i id="bootFill"></i></div>
        <div id="bootMsg">LOADING</div>
      </div>
    </div>
  </div>
  <script src="src/feel.js"></script>
  <script src="src/motion.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/stages.js"></script>
  <script src="src/comic.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
